<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریت انبار و زنجیره تأمین</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 bg-slate-900 text-white">
                <div class="flex items-center justify-center h-16 bg-slate-800 px-4">
                    <h1 class="text-lg font-bold">سامانه سازمانی انبار</h1>
                </div>
                <div class="flex flex-col flex-grow px-4 py-6 space-y-2">
                    <a href="/" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-indigo-600 text-white">
                        <i class="fa-solid fa-chart-pie ml-3"></i> داشبورد
                    </a>
                    <a href="/products" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
                        <i class="fa-solid fa-boxes-stacked ml-3"></i> مدیریت کالاها
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8">
                <h2 class="text-xl font-bold text-slate-800">داشبورد مرکزی</h2>
                <span class="text-sm bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">وضعیت سیستم: عملیاتی</span>
            </header>

            <main class="p-8">
                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center">
                        <div class="p-4 bg-indigo-50 text-indigo-600 rounded-xl ml-4"><i class="fa-solid fa-box text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">تعداد کل کالاها</p>
                            <h3 class="text-2xl font-bold text-slate-800">{{ total_products }}</h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center">
                        <div class="p-4 bg-blue-50 text-blue-600 rounded-xl ml-4"><i class="fa-solid fa-warehouse text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">تعداد انبارها</p>
                            <h3 class="text-2xl font-bold text-slate-800">{{ total_warehouses }}</h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center">
                        <div class="p-4 bg-amber-50 text-amber-600 rounded-xl ml-4"><i class="fa-solid fa-truck-field text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">تعداد تأمین‌کنندگان</p>
                            <h3 class="text-2xl font-bold text-slate-800">{{ total_suppliers }}</h3>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">دسترسی سریع</h3>
                    <a href="/products" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition">
                        مشاهده لیست کالاها <i class="fa-solid fa-arrow-left mr-2"></i>
                    </a>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
